name: Runtime closure 014-R1
on:
  pull_request:
    branches: [main, 'codex/014-r1-*']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_STREAMLIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dashboard.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/e2e_014_r1.py
